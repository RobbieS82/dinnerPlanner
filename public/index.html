<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Recipe Selector</title>
  <style>
    html * {
      box-sizing: border-box;
    }

  /* nested meal → ingredients list styling */
  .meal-item { margin-bottom: 0.5em; }
  .meal-item-title { font-weight: bold; }
  .meal-item ul { margin: 0.25em 0 0 1em; padding-left: 1em; }
    body {
      font-family: Arial, sans-serif;
      display: grid;
      grid-template-columns: 25% 1fr;
      gap: 10px;
      padding:0;
      margin:0;
      height: 100vh;
      overflow: hidden;
    }

    .selection-column {
      padding: 10px;
      background-color: darkslategray;
      color: white;
      overflow-y: auto;
    }

    #recipe-list {
      max-height: 80vh;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    #recipe-list label {
      display: block;
      cursor: pointer;
    }

    .attention-grabber {
      color: #d9534f;
      font-weight: bold;
    }

    #submitbtn {
      background-color: #5cb85c;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      font-size: larger;
    }

    small {
      display: block;
      margin-top: 10px;
    }

    small a {
      color: /* darker relative to darkslategray */ #b0c4de;
      text-decoration: none;
    }

  dialog {
    border: none;
    border-radius: 8px;
    padding: 1.5em;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
    max-width: 400px;
    margin: auto;
  }
  dialog::backdrop {
    background: rgba(0,0,0,0.8);
  }

  progress {
    width: 100%;
    height: 6px;
    margin-top: 0.5em;
    appearance: none;
  }


  .shopping-list-column {
    padding-bottom: 80px;
    overflow-y: auto;
  }

  .import-export {
    margin-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.3);
    padding-top: 12px;
  }

  .import-export h2 {
    font-size: 1em;
    margin: 0 0 8px;
  }

  .import-export button {
    background-color: #5bc0de;
    color: white;
    border: none;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 0.9em;
    margin-top: 4px;
    width: 100%;
  }

  .import-export button:hover {
    background-color: #46b8da;
  }

  #importFile {
    width: 100%;
    margin-top: 6px;
    font-size: 0.85em;
    color: white;
  }

  #importStatus {
    margin-top: 6px;
    font-size: 0.85em;
    min-height: 1.2em;
  }

  /* ── Responsive: single-column on small screens ── */
  @media (max-width: 768px) {
    body {
      grid-template-columns: 1fr;
      height: auto;
      overflow: auto;
    }

    #recipe-list {
      max-height: 40vh;
    }

    .shopping-list-column {
      padding: 10px 10px 20px;
    }
  }

  </style>
</head>
<body>
  <div class="selection-column">
    <h1>Select Meals</h1>
    <form id="recipe-form">
      <div id="recipe-list"></div>
      <button id="submitbtn" type="submit">Get Shopping List</button>
      <!-- add a link to the github repo -->
      <small><a href="https://github.com/RobbieS82/dinnerPlanner">DinnerPlanner by Simpl</a></small>
    </form>
    <div class="import-export">
      <h2>Recipes</h2>
      <button type="button" id="exportBtn">⬇ Export Recipes (JSON)</button>
      <label for="importFile" style="display:block; margin-top:10px;">⬆ Import Recipes (JSON):</label>
      <input type="file" id="importFile" accept=".json" />
      <button type="button" id="importBtn">Import</button>
      <div id="importStatus"></div>
    </div>
  </div>

  <div class="shopping-list-column">
    <h2>Meal Plan</h2>
    <ul id="meal-list"></ul>

    <h2>Shopping List</h2>
    <ul id="shopping-list"></ul>
    <p class="attention-grabber">Check the recipes you want to include in your shopping list, then click "Get Shopping List".</p>
  </div>

  <dialog id="resumeDialog">
    <h3>Picking up where you last left off!</h3>
    <p>We've restored your selections from last time you were here.</p>
    <button type="button" id="closeDialogBtn">
      Okay
    </button>
    <progress id="resumeProgress" value="0" max="100"></progress>
  </dialog>

  <script>
    // All recipe data is managed in localStorage; no recipe data is ever sent to the server.

    let allRecipes = [];

    /**
     * Extracts all ingredients from the selected recipes, normalises them
     * (lowercase, trimmed), aggregates quantities, and returns a sorted list.
     * Mirrors the logic previously handled server-side.
     */
    function buildShoppingList(recipes, selectedNames) {
      const ingredientMap = new Map();
      const selectedMeals = [];
      const mealIngredients = {};

      recipes.forEach(({ name, ingredients }) => {
        if (selectedNames.includes(name)) {
          selectedMeals.push(name);
          mealIngredients[name] = Array.isArray(ingredients) ? [...ingredients] : [];
          ingredients.forEach((raw) => {
            const match = raw.match(/^(.*?)(?:\s*x(\d+))?$/i);
            const item = match[1].trim().toLowerCase();
            const qty = match[2] ? parseInt(match[2], 10) : 1;

            if (ingredientMap.has(item)) {
              ingredientMap.set(item, ingredientMap.get(item) + qty);
            } else {
              ingredientMap.set(item, qty);
            }
          });
        }
      });

      const sortedList = Array.from(ingredientMap.entries())
        .sort((a, b) => a[0].localeCompare(b[0]))
        .map(([item, qty]) => `${item} x${qty}`);

      return {
        selectedMeals: selectedMeals.sort(),
        shoppingList: sortedList,
        mealIngredients
      };
    }

    /**
     * Loads recipes from localStorage. On the very first visit (no cached data),
     * fetches the default recipe list from the server (GET only – no data is sent
     * from the client) and stores it in localStorage for all future visits.
     */
    async function loadRecipes() {
      const stored = localStorage.getItem('recipes');
      if (stored) {
        allRecipes = JSON.parse(stored);
      } else {
        const res = await fetch('/recipes');
        allRecipes = await res.json();
        localStorage.setItem('recipes', JSON.stringify(allRecipes));
      }

      const container = getRecipeList();
      allRecipes.forEach(recipe => {
        const label = document.createElement('label');
        label.innerHTML = `<input type="checkbox" value="${recipe.name}" /> ${recipe.name}`;
        container.appendChild(label);
        container.appendChild(document.createElement('br'));
      });
    }

  function showResumeDialog() {
    const dialog = getResumeModal();
    const progress = dialog.querySelector("#resumeProgress");
    const closeBtn = dialog.querySelector("#closeDialogBtn");

    dialog.showModal();

    let duration = 2000; // seconds
    let interval = 50; // update every 100ms
    let elapsed = 0;

    const timer = setInterval(() => {
      elapsed += interval;
      progress.value = (elapsed / duration) * 100;

      if (elapsed >= duration) {
        clearInterval(timer);
        dialog.close();
      }
    }, interval);

    closeBtn.addEventListener("click", () => {
      clearInterval(timer);
      dialog.close();
    });
  }

    function toggleAttentionGrabber(state="block"){
      const attentionGrabber = document.querySelector('.attention-grabber');
      if (attentionGrabber) {
        attentionGrabber.style.display = state;
      }
    }

    function getResumeModal(){
      return document.querySelector("#resumeDialog");
    }

    function getMealsList(){
      return document.querySelector("#meal-list");
    }

    function getIngList(){
      return document.querySelector("#shopping-list");
    }

    function getRecipeList(){
      return document.querySelector("#recipe-list");
    }

    function checkCachedMeals(meals){
      if(!Array.isArray(meals)){
        return;
      }

      meals.forEach(meal => {
        let chkbox = document.querySelector(`input[value="${meal}"]`);
        if(chkbox){
          chkbox.checked=true
        };
      });
    }

    function listCachedIngredients(ings){
      if(!Array.isArray(ings)){
        return;
      }

      const list = getIngList();

      ings.forEach(i => {
        let listItem = document.createElement("LI");
        listItem.textContent = i;
        list.appendChild(listItem);
      });
    }

    function renderMealPlan(mealNames, mealIngredients){
      const mealsEl = getMealsList();
      mealsEl.innerHTML = '';

      if(!Array.isArray(mealNames) || !mealIngredients){
        return;
      }

      mealNames.forEach(meal => {
        const li = document.createElement('li');
        li.className = 'meal-item';

        const title = document.createElement('span');
        title.className = 'meal-item-title';
        title.textContent = meal;
        li.appendChild(title);

        const ul = document.createElement('ul');
        const items = Array.isArray(mealIngredients[meal]) ? mealIngredients[meal] : [];
        items.forEach(raw => {
          const ingLi = document.createElement('li');
          ingLi.textContent = raw;
          ul.appendChild(ingLi);
        });

        li.appendChild(ul);
        mealsEl.appendChild(li);
      });
    }

    document.querySelector("#recipe-form").addEventListener('submit', (e) => {
      e.preventDefault();

      // Prevent multiple clicks on the button
      const button = e.target.querySelector('button');
      button.disabled = true;
      button.textContent = 'Processing...';

      // hide the attention grabber after the first click
      toggleAttentionGrabber("none");

      const checked = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'))
        .map(input => input.value);

      localStorage.setItem("lastMealsSelected", JSON.stringify(checked));

      // Compute shopping list entirely client-side – no data is sent to the server
      const data = buildShoppingList(allRecipes, checked);

      const list = document.getElementById('shopping-list');
      list.innerHTML = '';
      data.shoppingList.forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        list.appendChild(li);
      });

      localStorage.setItem("shoppingList", JSON.stringify(data.shoppingList));

      // render nested meal → ingredients
      renderMealPlan(data.selectedMeals, data.mealIngredients);

      // Re-enable the button after processing
      button.disabled = false;
      button.textContent = 'Get Shopping List';
    });

    loadRecipes().then(() => {
      const cachedMeals = JSON.parse(localStorage.getItem("lastMealsSelected")) ?? null;
      const cachedShoppingList = JSON.parse(localStorage.getItem("shoppingList")) ?? null;
      if(cachedMeals && cachedShoppingList){
        toggleAttentionGrabber("none");
        showResumeDialog();
      }
      checkCachedMeals(cachedMeals);
      // Restore the previous meal plan and shopping list entirely from localStorage
      if(Array.isArray(cachedMeals) && cachedMeals.length){
        const data = buildShoppingList(allRecipes, cachedMeals);
        renderMealPlan(data.selectedMeals, data.mealIngredients);
        const list = getIngList();
        list.innerHTML = '';
        const items = Array.isArray(cachedShoppingList) ? cachedShoppingList : data.shoppingList;
        items.forEach(item => {
          const li = document.createElement('li');
          li.textContent = item;
          list.appendChild(li);
        });
      } else {
        listCachedIngredients(cachedShoppingList);
      }
    });

    document.getElementById("closeDialogBtn").addEventListener("click", () => {
      getResumeModal().close();
    });

    // Export all recipes from localStorage as a downloadable JSON file
    document.getElementById("exportBtn").addEventListener("click", () => {
      const recipes = JSON.parse(localStorage.getItem('recipes')) || [];
      const json = JSON.stringify(recipes, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'recipes.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // Import recipes from a user-selected JSON file into localStorage
    document.getElementById("importBtn").addEventListener("click", async () => {
      const fileInput = document.getElementById("importFile");
      const statusEl = document.getElementById("importStatus");
      const file = fileInput.files[0];

      if (!file) {
        statusEl.style.color = "#f0ad4e";
        statusEl.textContent = "Please select a JSON file first.";
        return;
      }

      statusEl.style.color = "white";
      statusEl.textContent = "Importing…";

      try {
        const text = await file.text();
        let imported;
        try {
          imported = JSON.parse(text);
        } catch {
          statusEl.style.color = "#d9534f";
          statusEl.textContent = "Error: file is not valid JSON.";
          return;
        }

        if (!Array.isArray(imported)) {
          statusEl.style.color = "#d9534f";
          statusEl.textContent = "Import failed: expected an array of recipes.";
          return;
        }

        for (const recipe of imported) {
          if (typeof recipe.name !== 'string' || !recipe.name.trim()) {
            statusEl.style.color = "#d9534f";
            statusEl.textContent = "Import failed: each recipe must have a non-empty name.";
            return;
          }
          if (!Array.isArray(recipe.ingredients)) {
            statusEl.style.color = "#d9534f";
            statusEl.textContent = `Import failed: recipe "${recipe.name}" must have an ingredients array.`;
            return;
          }
        }

        // Normalise imported entries so all have the expected fields
        const normalised = imported.map(r => ({
          name: r.name.trim(),
          ingredients: r.ingredients,
          tags: Array.isArray(r.tags) ? r.tags : [],
          source: typeof r.source === 'string' ? r.source : ''
        }));

        // Merge into localStorage: existing recipes updated or new ones added, keyed by name
        const existing = JSON.parse(localStorage.getItem('recipes')) || [];
        const recipeMap = new Map(existing.map(r => [r.name, r]));
        normalised.forEach(r => recipeMap.set(r.name, r));
        localStorage.setItem('recipes', JSON.stringify(Array.from(recipeMap.values())));

        statusEl.style.color = "#5cb85c";
        statusEl.textContent = `Imported ${imported.length} recipe(s). Reloading…`;
        const RELOAD_DELAY_MS = 800;
        setTimeout(() => location.reload(), RELOAD_DELAY_MS);
      } catch (err) {
        statusEl.style.color = "#d9534f";
        statusEl.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
